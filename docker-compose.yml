version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: acs_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acs_db}
      POSTGRES_USER: ${POSTGRES_USER:-acs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acs_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acs_user} -d ${POSTGRES_DB:-acs_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acs_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-acs_user}:${POSTGRES_PASSWORD:-acs_secret}@db:5432/${POSTGRES_DB:-acs_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acs_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
